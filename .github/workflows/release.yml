# Builds the Ilmoria desktop app for Windows and macOS and publishes the installers.
#
# Raise "version" in package.json and push to main: the installers are built and published as
# release v<version> (a version already released is only built, not published again).
# It can also be run by hand from the Actions tab, or by pushing a tag such as v1.0.1.
#
# Signing is optional and switches on by itself when these repository secrets exist:
#   Windows: WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD
#   macOS:   CSC_LINK (base64 Developer ID Application .p12) and CSC_KEY_PASSWORD,
#            plus APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID to notarize
# Without them the Mac app is signed "ad hoc" (it opens after Control-click > Open)
# and Windows shows SmartScreen's "More info > Run anyway".
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Version $V is already released: building only"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  mac:
    needs: version
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.CSC_LINK != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build, signed and notarized (with the Apple certificate)
        if: env.HAS_CERT == 'yes'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Build, signed ad hoc (no Apple certificate yet)
        if: env.HAS_CERT != 'yes'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dir --arm64 --x64 --publish never -c.mac.identity=null -c.mac.hardenedRuntime=false
          VERSION=$(node -p "require('./package.json').version")
          for pair in "mac-arm64:arm64" "mac:x64"; do
            dir="dist/${pair%%:*}"; arch="${pair##*:}"
            codesign --force --deep --sign - "$dir/Ilmoria.app"
            codesign --verify --deep --strict "$dir/Ilmoria.app"
            stage="dist/dmg-$arch"; rm -rf "$stage"; mkdir -p "$stage"
            cp -R "$dir/Ilmoria.app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Ilmoria" -srcfolder "$stage" -ov -format UDZO "dist/Ilmoria-$VERSION-mac-$arch.dmg"
            ditto -c -k --keepParent "$dir/Ilmoria.app" "dist/Ilmoria-$VERSION-mac-$arch.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, windows, mac]
    if: needs.version.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Copies with fixed names (for links that always give the newest version)
        run: |
          cd out
          cp Ilmoria-Setup-*.exe Ilmoria-Setup.exe
          cp Ilmoria-*-mac-arm64.dmg Ilmoria-mac-arm64.dmg
          cp Ilmoria-*-mac-x64.dmg Ilmoria-mac-x64.dmg
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ilmoria ${{ needs.version.outputs.version }}
          make_latest: 'true'
          files: out/*
          body: |
            Ilmoria for Windows and macOS: the whole of Ilmoria in a window of its own, on the same server and accounts as app.ilmoria.com.

            - **Windows 10 and 11:** Ilmoria-Setup.exe
            - **Mac with Apple silicon (M1 and newer):** Ilmoria-mac-arm64.dmg
            - **Mac with an Intel processor:** Ilmoria-mac-x64.dmg

            Download page: https://app.ilmoria.com/download
