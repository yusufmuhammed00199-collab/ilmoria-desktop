<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Share your screen</title>
<style>
  :root { --teal: #0E9F8E; --teal-ink: #0B7F72; --ink: #0F1B33; --muted: #5B6779; --line: #E3E8EE; --canvas: #F2F5F8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; display: flex; flex-direction: column; }
  header { padding: 18px 22px 0; }
  h1 { font-size: 18px; margin: 0; font-weight: 750; letter-spacing: -0.01em; }
  p.sub { margin: 4px 0 0; color: var(--muted); }
  .tabs { display: flex; gap: 4px; margin: 14px 22px 0; padding: 3px; background: var(--canvas); border-radius: 999px; width: max-content; }
  .tabs button { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15,27,51,.12); }
  main { flex: 1; overflow-y: auto; padding: 16px 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .item { border: 2px solid transparent; border-radius: 14px; padding: 8px; background: var(--canvas); cursor: pointer; text-align: start; font: inherit; color: inherit; }
  .item:hover { border-color: #C8D3DD; }
  .item[aria-pressed="true"] { border-color: var(--teal); background: #E8F6F4; }
  .item:focus-visible { outline: 3px solid rgba(14,159,142,.35); outline-offset: 2px; }
  .thumb { aspect-ratio: 16 / 10; width: 100%; border-radius: 9px; background: #DCE3EA center / contain no-repeat; display: block; }
  .name { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-weight: 600; font-size: 13px; overflow: hidden; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name img { width: 16px; height: 16px; flex: none; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  footer { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); }
  footer .hint { color: var(--muted); font-size: 12.5px; margin-inline-end: auto; }
  .btn { font: inherit; font-weight: 650; border-radius: 999px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.primary:hover { background: var(--teal-ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 3px solid rgba(14,159,142,.35); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1 data-t="title">Share your screen</h1>
  <p class="sub" data-t="sub">Choose what everyone on the call will see.</p>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tab-screen" aria-selected="true" data-t="screenTab">Entire screen</button>
  <button role="tab" id="tab-window" aria-selected="false" data-t="windowTab">A window</button>
</div>
<main><div class="grid" id="grid" role="listbox"></div><p class="empty" id="empty" hidden></p></main>
<footer>
  <span class="hint" id="hint"></span>
  <button class="btn" id="cancel" data-t="cancel">Cancel</button>
  <button class="btn primary" id="share" disabled data-t="share">Share</button>
</footer>
<script>
  const q = new URLSearchParams(location.search);
  const mac = q.get('mac') === '1';
  const AR = q.get('lang') === 'ar';
  const W = {
    title: ['Share your screen', 'مشاركة الشاشة'],
    sub: ['Choose what everyone on the call will see.', 'اختر ما سيراه الجميع في المكالمة.'],
    screenTab: ['Entire screen', 'الشاشة كاملة'],
    windowTab: ['A window', 'نافذة'],
    cancel: ['Cancel', 'إلغاء'],
    share: ['Share', 'مشاركة'],
    hint: ['Nothing listed? Allow Ilmoria in System Settings, Privacy & Security, Screen Recording.', 'لا يظهر شيء؟ اسمح لـ إلموريا من إعدادات النظام، ثم الخصوصية والأمان، ثم تسجيل الشاشة.'],
    noScreens: ['No screens to share.', 'لا توجد شاشات للمشاركة.'],
    noWindows: ['No open windows to share.', 'لا توجد نوافذ مفتوحة للمشاركة.'],
    screenN: ['Screen {n}', 'الشاشة {n}'],
    yourScreen: ['Your screen', 'شاشتك'],
  };
  const tr = (k, n) => W[k][AR ? 1 : 0].replace('{n}', n);
  document.documentElement.lang = AR ? 'ar' : 'en';
  document.documentElement.dir = AR ? 'rtl' : 'ltr';
  document.title = tr('title');
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = tr(el.dataset.t); });
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const share = document.getElementById('share');
  let all = [];
  let kind = 'screen';
  let chosen = null;

  document.getElementById('hint').textContent = mac ? tr('hint') : '';

  function draw() {
    const list = all.filter((s) => s.kind === kind);
    grid.textContent = '';
    empty.hidden = list.length > 0;
    empty.textContent = kind === 'screen' ? tr('noScreens') : tr('noWindows');
    list.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'item';
      b.type = 'button';
      b.setAttribute('role', 'option');
      b.setAttribute('aria-pressed', String(s.id === chosen));
      const t = document.createElement('span');
      t.className = 'thumb';
      if (s.thumb) t.style.backgroundImage = `url("${s.thumb}")`;
      const n = document.createElement('div');
      n.className = 'name';
      if (s.icon) { const ic = document.createElement('img'); ic.src = s.icon; ic.alt = ''; n.appendChild(ic); }
      const label = document.createElement('span');
      label.textContent = kind === 'screen' && list.length > 1 ? tr('screenN', i + 1) : (kind === 'screen' ? tr('yourScreen') : s.name);
      n.appendChild(label);
      b.append(t, n);
      b.addEventListener('click', () => { chosen = s.id; share.disabled = false; draw(); });
      b.addEventListener('dblclick', () => window.picker.choose(s.id));
      grid.appendChild(b);
    });
  }

  function tab(k) {
    kind = k;
    chosen = null;
    share.disabled = true;
    document.getElementById('tab-screen').setAttribute('aria-selected', String(k === 'screen'));
    document.getElementById('tab-window').setAttribute('aria-selected', String(k === 'window'));
    draw();
  }
  document.getElementById('tab-screen').addEventListener('click', () => tab('screen'));
  document.getElementById('tab-window').addEventListener('click', () => tab('window'));
  document.getElementById('cancel').addEventListener('click', () => window.picker.choose(null));
  share.addEventListener('click', () => chosen && window.picker.choose(chosen));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.picker.choose(null);
    if (e.key === 'Enter' && chosen) window.picker.choose(chosen);
  });

  window.picker.sources().then((list) => {
    all = list || [];
    const screens = all.filter((s) => s.kind === 'screen');
    if (screens.length === 1) { chosen = screens[0].id; share.disabled = false; }
    draw();
  });
</script>
</body>
</html>
